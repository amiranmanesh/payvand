name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Build with exactly the toolchain go.mod asks for. Letting an older runner
  # toolchain download a newer one mixes compiler versions and fails the build.
  GOTOOLCHAIN: local

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify the standard library only policy
        run: |
          if grep -q '^require' go.mod; then
            echo "payvand must depend on the standard library only"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
